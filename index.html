<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Champions - Competitive Team Builder</title>
    <meta name="description" content="Generate and optimize championship lineups for Singles and Doubles Pokémon battles with PokéAPI data, EV/IV tuning, synergy analysis, drag-and-drop squad management, interactive type charts, and image export." />
    <meta property="og:title" content="Pokémon Champions - Competitive Team Builder" />
    <meta property="og:description" content="Generate and optimize championship lineups for Singles and Doubles Pokémon battles with PokéAPI data, EV/IV tuning, synergy analysis, drag-and-drop squad management, interactive type charts, and image export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('poke_theme');
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
